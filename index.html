<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro">☀️ Claro</button>
  <h1 class="game-title">TETRIS</h1>
  <div class="mode-select" role="group" aria-label="Modo de juego">
    <button id="mode-classic" type="button" aria-pressed="true">Clásico</button>
    <button id="mode-challenge" type="button" aria-pressed="false">Desafío: 40 líneas</button>
  </div>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section hidden" id="timer-section">
          <span class="label">TIEMPO</span>
          <span class="value" id="timer">2:00</span>
        </div>
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- Records (game over) -->
        <div id="overlay-records" class="records hidden">
          <p id="record-msg" class="records-msg" aria-live="polite"></p>
          <form id="record-form" class="record-form hidden">
            <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" aria-label="Nombre del jugador" />
            <button id="record-save" type="submit">Guardar</button>
          </form>
          <table class="records-table">
            <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Modo</th></tr></thead>
            <tbody id="over-records"></tbody>
          </table>
          <p id="over-records-stats" class="records-stats"></p>
          <button id="reset-records-over" class="records-reset" type="button">Borrar records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Records: pantalla de inicio -->
    <div id="start-screen" class="overlay hidden">
      <div class="overlay-box records">
        <p class="records-title">RECORDS</p>
        <table class="records-table">
            <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Modo</th></tr></thead>
            <tbody id="start-records"></tbody>
          </table>
        <p id="start-records-stats" class="records-stats"></p>
        <button id="play-btn" type="button">Jugar</button>
        <button id="reset-records-start" class="records-reset" type="button">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
